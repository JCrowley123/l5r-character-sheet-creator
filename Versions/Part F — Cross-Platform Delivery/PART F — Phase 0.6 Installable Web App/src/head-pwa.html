<!-- ============================================================
     PART F — PHASE 0.6 · INSTALLABLE WEB APP

     Injected immediately before the closing head tag by build/build_pwa.py.
     Nothing here touches the sheet's own markup, styles or script: it is
     metadata plus one registration call, all of it additive, which is why this
     phase needs no change to any Phase 0 source file.

     Note the wording above. This comment deliberately does NOT contain a
     literal closing-head tag: it ships inside the built page, and a copy in
     here would give the output two of them. The build searches for that tag as
     a unique anchor, and so might anything written later -- a second one hiding
     in a comment is exactly the sort of thing that works until it doesn't.
     build_pwa.py now refuses to inject a block containing one.

     Removing this block and the files it points at returns the build to a
     plain web page. Nothing else depends on it.
     ============================================================ -->

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#efe7d4">

<!-- Safari ignores the manifest for home-screen installs and reads these
     instead. Both sets are needed for one build to install on iPhone and
     Android alike. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="L5R Sheet">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Ordinary favicon, for the browser tab before anything is installed. -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<script>
/* Register the service worker. Guarded on every side, because a character
   sheet that fails to open is a far worse outcome than one that merely fails
   to work offline:

     - 'serviceWorker' in navigator   absent on older browsers, and on any
                                      page served over plain http
     - file:// protocol              the sheet is still opened by double-click
                                      from disk, where registration throws
     - .catch()                      registration can be refused outright by
                                      private-browsing modes and some MDM
                                      profiles

   In every one of those cases the sheet loads exactly as it did before this
   phase existed; it simply is not installable. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;

  /* Say so, once, when the sheet becomes usable without a signal.

     Until this existed the state was invisible: the app looked identical
     whether or not it would survive losing signal, so the first honest way to
     find out was to lose signal and get an error. A player adding the app to
     their home screen and immediately testing aeroplane mode would see it fail
     for no discoverable reason. One small confirmation removes that whole
     class of confusion.

     Shown once per install, not once per launch -- it is reassurance, not a
     status bar. */
  function announceOfflineReady() {
    try {
      if (localStorage.getItem('l5r-offline-announced') === '1') return;
      localStorage.setItem('l5r-offline-announced', '1');
    } catch (e) { /* private mode: show it, just do not remember doing so */ }

    var el = document.createElement('div');
    el.setAttribute('role', 'status');
    el.textContent = 'Ready to use offline';
    el.style.cssText = [
      'position:fixed', 'left:50%', 'bottom:24px', 'transform:translateX(-50%)',
      'z-index:9999', 'padding:9px 16px', 'border-radius:999px',
      'background:#efe7d4', 'color:#2a2420', 'border:1px solid #a9843f',
      'font-family:Georgia,serif', 'font-size:14px',
      'box-shadow:0 2px 10px rgba(42,36,32,.22)', 'pointer-events:none',
      'opacity:0', 'transition:opacity .25s ease',
    ].join(';');
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = '1'; });
    setTimeout(function () {
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    }, 3200);
  }

  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'l5r-offline-ready') announceOfflineReady();
  });

  /* Register as soon as the document is parsed, NOT on window 'load'.

     The usual advice is to wait for 'load' so registration does not compete
     with the page's own resources. That advice backfires here: 'load' waits for
     every subresource including the Google Fonts stylesheet and its font files,
     which are cross-origin and, on a slow or filtered connection, can be the
     slowest thing on the page. Registration -- and therefore the moment the app
     becomes usable offline -- would sit behind them for no reason. The sheet
     itself is one already-downloaded file; there is nothing left to compete
     with by the time the DOM is ready. */
  function register() {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      /* Deliberately quiet in the console rather than silent, so a failure is
         discoverable when looked for but never alarms a player mid-game. */
      if (window.console && console.info) {
        console.info('L5R sheet: offline support unavailable —', err && err.message);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', register);
  } else {
    register();
  }
})();
</script>
